name: rss-watch
x-common: &common
  image: ${RSS_WATCH_IMAGE:-ghcr.io/imymi/rss-watch}:${RSS_WATCH_VERSION:-0.2.0}
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  stop_grace_period: 45s
  environment:
    TZ: ${TZ:-Asia/Shanghai}
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
services:
  web:
    <<: *common
    command: [web]
    ports:
      - "${RSS_WATCH_BIND:-127.0.0.1}:${RSS_WATCH_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RSS_WATCH_SECURE_COOKIES: ${RSS_WATCH_SECURE_COOKIES:-0}
      RSS_WATCH_TRUSTED_PROXIES: ${RSS_WATCH_TRUSTED_PROXIES:-127.0.0.1}
    volumes:
      - rss-data:/data
      - rss-credentials:/credentials
    healthcheck:
      test: [CMD, rss-watch-container, check-web]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
  worker:
    <<: *common
    command: [worker]
    volumes:
      - rss-data:/data
      - rss-credentials:/credentials:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, rss-watch-container, check-worker]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  rss-data:
  rss-credentials:
