[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rss-watch"
version = "0.1.0"
description = "Linux RSS keyword monitor with a Chinese CLI and Feishu notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.16,<1",
  "rich>=14,<15",
  "httpx>=0.28,<0.29",
  "feedparser>=6.0.11,<7",
]

[project.scripts]
rss-watch = "rss_watch.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

